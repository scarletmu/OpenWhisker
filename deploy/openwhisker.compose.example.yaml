# OpenWhisker daemon — deployment template.
#
# This is a COMMITTED TEMPLATE. Copy it to deploy/local/compose.yaml
# (git-ignored) and fill in real values there. Never put real homeserver
# URLs, room IDs, tokens, or machine paths in this file.
#
# It defines only the OpenWhisker `daemon` service. To co-locate it
# with a self-hosted homeserver, merge this service into the Synapse / Caddy /
# PostgreSQL skeleton in docs/adapters/matrix-private-im.md.
#
# Build the image first:  make docker-build
# Then bring it up:       docker compose -f deploy/local/compose.yaml up -d

services:
  openwhisker:
    image: openwhisker:local
    restart: unless-stopped
    # Long-running workflow host. Matrix poll starts only when Matrix env vars
    # are complete.
    command:
      - daemon
      - --db
      - data/openwhisker.db
      - --vault
      - /vault
      - --vault-profile
      - knowledge-vault
      - --status-file
      - data/daemon-status.json
      - --matrix
      - auto
    # OPENWHISKER_* configuration is injected from the env file.
    # The path is relative to THIS compose file — adjust it after copying.
    # See .env.local.example for the full variable reference.
    env_file:
      - <path-to>/.env.local
    volumes:
      # Persistent runtime state: SQLite DB, Matrix session, since-token.
      - ./data:/home/openwhisker/data
      # Target Obsidian vault, mounted read-write (OpenWhisker writes
      # Raw/Inbox notes). Real-vault + Obsidian Sync sign-off is out of v1
      # scope — see docs/deployment/README.md.
      - <host-vault-path>:/vault
    # When co-located with the Synapse stack from matrix-private-im.md:
    # depends_on:
    #   - synapse
